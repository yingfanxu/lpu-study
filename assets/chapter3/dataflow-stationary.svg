<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a9"/></marker><style>.t{font:700 30px sans-serif;fill:#17385f}.h{font:700 22px sans-serif;fill:#17385f}.b{font:18px sans-serif;fill:#536b80}.p{font:700 20px sans-serif;fill:#29455f}</style></defs>
  <rect width="1400" height="650" rx="20" fill="#fbfdff"/><text x="700" y="46" text-anchor="middle" class="t">三种 Stationary：选择哪类数据留在 PE 内</text>
  <g transform="translate(70 120)"><text x="190" y="0" text-anchor="middle" class="h">Weight Stationary</text><rect x="90" y="65" width="200" height="160" rx="16" fill="#dceafa" stroke="#2563a9" stroke-width="4"/><text x="190" y="135" text-anchor="middle" class="p">PE 本地寄存器</text><text x="190" y="175" text-anchor="middle" class="h">权重 B 不动</text><path d="M0 115H80M300 115H380" stroke="#e67c37" stroke-width="5" marker-end="url(#a)"/><text x="25" y="95" class="b">A 流入</text><text x="310" y="95" class="b">C 流出</text><text x="190" y="280" text-anchor="middle" class="b">权重装载一次，多批激活复用</text></g>
  <g transform="translate(510 120)"><text x="190" y="0" text-anchor="middle" class="h">Output Stationary</text><rect x="90" y="65" width="200" height="160" rx="16" fill="#fff4d8" stroke="#c99319" stroke-width="4"/><text x="190" y="135" text-anchor="middle" class="p">PE 本地寄存器</text><text x="190" y="175" text-anchor="middle" class="h">部分和 C 不动</text><path d="M0 105H80M0 170H80" stroke="#2563a9" stroke-width="5" marker-end="url(#a)"/><text x="25" y="85" class="b">A 流入</text><text x="25" y="210" class="b">B 流入</text><text x="190" y="280" text-anchor="middle" class="b">累加完成前不读写部分和</text></g>
  <g transform="translate(950 120)"><text x="190" y="0" text-anchor="middle" class="h">Input Stationary</text><rect x="90" y="65" width="200" height="160" rx="16" fill="#dff3e9" stroke="#249c69" stroke-width="4"/><text x="190" y="135" text-anchor="middle" class="p">PE 本地寄存器</text><text x="190" y="175" text-anchor="middle" class="h">激活 A 不动</text><path d="M0 115H80M300 115H380" stroke="#7753a6" stroke-width="5" marker-end="url(#a)"/><text x="25" y="95" class="b">B 流入</text><text x="310" y="95" class="b">C 流出</text><text x="190" y="280" text-anchor="middle" class="b">同一激活与多组权重计算</text></g>
  <rect x="200" y="520" width="1000" height="70" rx="14" fill="#eaf3fb"/><text x="700" y="550" text-anchor="middle" class="h">评价标准：A、B、C 各自复用了多少次？片外总共搬了多少 Byte？</text><text x="700" y="578" text-anchor="middle" class="b">真正目标不是给数据流贴标签，而是最小化目标负载的能耗与访存流量</text>
</svg>
