<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a9"/></marker><style>.t{font:700 30px sans-serif;fill:#17385f}.h{font:700 22px sans-serif;fill:#17385f}.b{font:18px sans-serif;fill:#536b80}.p{font:700 18px sans-serif;fill:#29455f}</style></defs>
  <rect width="1400" height="700" rx="20" fill="#fbfdff"/><text x="700" y="46" text-anchor="middle" class="t">三种控制架构：灵活性、开销与确定性的取舍</text>
  <line x1="466" y1="85" x2="466" y2="630" stroke="#d8e3ed" stroke-width="2"/><line x1="933" y1="85" x2="933" y2="630" stroke="#d8e3ed" stroke-width="2"/>
  <text x="233" y="105" text-anchor="middle" class="h">粗粒度顺序控制</text><text x="700" y="105" text-anchor="middle" class="h">分布式众核</text><text x="1166" y="105" text-anchor="middle" class="h">VLIW 全静态调度</text>
  <g transform="translate(65 155)"><rect x="80" y="0" width="180" height="65" rx="12" fill="#fff4d8" stroke="#c99319" stroke-width="3"/><text x="170" y="40" text-anchor="middle" class="p">简单标量控制器</text><path d="M170 65V120" stroke="#2563a9" stroke-width="4" marker-end="url(#a)"/><g fill="#dceafa" stroke="#2563a9" stroke-width="3"><rect x="0" y="125" width="100" height="85" rx="10"/><rect x="120" y="125" width="100" height="85" rx="10"/><rect x="240" y="125" width="100" height="85" rx="10"/></g><g class="p" text-anchor="middle"><text x="50" y="175">矩阵</text><text x="170" y="175">向量</text><text x="290" y="175">DMA</text></g><text x="170" y="280" text-anchor="middle" class="b">控制少、验证简单、行为确定</text><text x="170" y="315" text-anchor="middle" class="b">代价：新算子映射能力有限</text></g>
  <g transform="translate(520 155)"><g fill="#dceafa" stroke="#2563a9" stroke-width="3"><rect x="0" y="0" width="150" height="130" rx="12"/><rect x="170" y="0" width="150" height="130" rx="12"/><rect x="0" y="155" width="150" height="130" rx="12"/><rect x="170" y="155" width="150" height="130" rx="12"/></g><g class="p" text-anchor="middle"><text x="75" y="38">标量核</text><text x="75" y="72">+ 矩阵/向量</text><text x="245" y="38">标量核</text><text x="245" y="72">+ 矩阵/向量</text><text x="75" y="193">标量核</text><text x="75" y="227">+ 矩阵/向量</text><text x="245" y="193">标量核</text><text x="245" y="227">+ 矩阵/向量</text></g><path d="M75 130V150M245 130V150M150 65H165M150 220H165" stroke="#e67c37" stroke-width="3"/><text x="160" y="335" text-anchor="middle" class="b">灵活性最高，Kernel 可编程</text><text x="160" y="370" text-anchor="middle" class="b">代价：控制、同步与软件栈复杂</text></g>
  <g transform="translate(1000 155)"><rect x="15" y="0" width="300" height="70" rx="12" fill="#efeafb" stroke="#7753a6" stroke-width="3"/><text x="165" y="30" text-anchor="middle" class="p">编译器生成逐拍时间表</text><text x="165" y="55" text-anchor="middle" class="b">每拍每个单元做什么</text><path d="M165 70V120" stroke="#2563a9" stroke-width="4" marker-end="url(#a)"/><g fill="#dff3e9" stroke="#249c69" stroke-width="3"><rect x="0" y="125" width="95" height="90" rx="10"/><rect x="115" y="125" width="95" height="90" rx="10"/><rect x="230" y="125" width="95" height="90" rx="10"/></g><g class="p" text-anchor="middle"><text x="47" y="177">矩阵</text><text x="162" y="177">向量</text><text x="277" y="177">DMA</text></g><rect x="0" y="240" width="325" height="45" rx="8" fill="#fff4d8"/><text x="162" y="269" text-anchor="middle" class="p">无动态仲裁 · 确定性执行</text><text x="162" y="335" text-anchor="middle" class="b">利用率与尾延迟确定性高</text><text x="162" y="370" text-anchor="middle" class="b">代价：编译器极难，动态负载不自然</text></g>
  <rect x="205" y="595" width="990" height="60" rx="14" fill="#eaf3fb"/><text x="700" y="633" text-anchor="middle" class="h">架构选择不仅取决于负载，也取决于团队的软件、编译器与验证能力</text>
</svg>
