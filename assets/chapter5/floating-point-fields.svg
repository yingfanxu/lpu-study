<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs><style>.title{font:700 34px sans-serif;fill:#17385f}.h{font:700 23px sans-serif;fill:#17385f}.b{font:19px sans-serif;fill:#506a80}.w{font:700 23px sans-serif;fill:#fff}</style></defs>
  <rect width="1400" height="620" rx="24" fill="#fbfdff"/><text x="700" y="55" text-anchor="middle" class="title">浮点格式：指数决定范围，尾数决定精度</text>
  <text x="100" y="135" class="h">FP32</text><rect x="240" y="95" width="55" height="70" fill="#e67c37"/><rect x="300" y="95" width="360" height="70" fill="#2563a9"/><rect x="665" y="95" width="635" height="70" fill="#249c69"/><text x="267" y="138" text-anchor="middle" class="w">S</text><text x="480" y="138" text-anchor="middle" class="w">指数 8</text><text x="982" y="138" text-anchor="middle" class="w">尾数 23</text>
  <text x="100" y="245" class="h">FP16</text><rect x="240" y="205" width="55" height="70" fill="#e67c37"/><rect x="300" y="205" width="225" height="70" fill="#2563a9"/><rect x="530" y="205" width="450" height="70" fill="#249c69"/><text x="267" y="248" text-anchor="middle" class="w">S</text><text x="412" y="248" text-anchor="middle" class="w">指数 5</text><text x="755" y="248" text-anchor="middle" class="w">尾数 10</text>
  <text x="100" y="355" class="h">BF16</text><rect x="240" y="315" width="55" height="70" fill="#e67c37"/><rect x="300" y="315" width="360" height="70" fill="#2563a9"/><rect x="665" y="315" width="315" height="70" fill="#249c69"/><text x="267" y="358" text-anchor="middle" class="w">S</text><text x="480" y="358" text-anchor="middle" class="w">指数 8</text><text x="822" y="358" text-anchor="middle" class="w">尾数 7</text>
  <text x="100" y="465" class="h">FP8 E4M3</text><rect x="240" y="425" width="55" height="70" fill="#e67c37"/><rect x="300" y="425" width="180" height="70" fill="#2563a9"/><rect x="485" y="425" width="135" height="70" fill="#249c69"/><text x="267" y="468" text-anchor="middle" class="w">S</text><text x="390" y="468" text-anchor="middle" class="w">指数 4</text><text x="552" y="468" text-anchor="middle" class="w">尾数 3</text>
  <rect x="820" y="425" width="480" height="115" rx="16" fill="#eaf3fb"/><text x="1060" y="470" text-anchor="middle" class="h">数值 = (−1)ˢ × 1.m × 2ᵉ⁻偏置</text><text x="1060" y="510" text-anchor="middle" class="b">低位格式通常需要缩放因子配合</text>
