<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a9"/></marker><style>.title{font:700 34px sans-serif;fill:#17385f}.h{font:700 24px sans-serif;fill:#17385f}.b{font:19px sans-serif;fill:#506a80}.w{font:700 23px sans-serif;fill:#fff}</style></defs>
  <rect width="1400" height="680" rx="24" fill="#fbfdff"/><text x="700" y="55" text-anchor="middle" class="title">双缓冲：搬运与计算重叠</text>
  <text x="150" y="130" class="h">阶段 N</text><rect x="270" y="90" width="380" height="100" rx="18" fill="#2563a9"/><text x="460" y="150" text-anchor="middle" class="w">计算引擎消费 A：tile N</text>
  <rect x="750" y="90" width="380" height="100" rx="18" fill="#249c69"/><text x="940" y="150" text-anchor="middle" class="w">DMA 填充 B：tile N+1</text>
  <path d="M460 205V275" stroke="#2563a9" stroke-width="5" marker-end="url(#a)"/><path d="M940 205V275" stroke="#2563a9" stroke-width="5" marker-end="url(#a)"/>
  <text x="150" y="350" class="h">阶段 N+1</text><rect x="270" y="305" width="380" height="100" rx="18" fill="#249c69"/><text x="460" y="365" text-anchor="middle" class="w">DMA 填充 A：tile N+2</text>
  <rect x="750" y="305" width="380" height="100" rx="18" fill="#2563a9"/><text x="940" y="365" text-anchor="middle" class="w">计算引擎消费 B：tile N+1</text>
  <rect x="190" y="495" width="1020" height="105" rx="18" fill="#eaf3fb"/><text x="700" y="540" text-anchor="middle" class="h">隐藏访存延迟的条件</text><text x="700" y="575" text-anchor="middle" class="b">搬一块的时间 ≤ 算一块的时间；SRAM 至少容纳两份工作集分块</text>
