<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a9"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e67c37"/></marker><style>.title{font:700 34px sans-serif;fill:#17385f}.h{font:700 24px sans-serif;fill:#17385f}.b{font:18px sans-serif;fill:#506a80}.w{font:700 20px sans-serif;fill:#fff}.n{font:700 19px sans-serif;fill:#17385f}</style></defs>
  <rect width="1500" height="760" rx="24" fill="#fbfdff"/><text x="750" y="55" text-anchor="middle" class="title">三种并行策略，对应三种通信模式</text>
  <g transform="translate(45 105)"><rect width="440" height="555" rx="22" fill="#eef5fc" stroke="#2563a9" stroke-width="3"/><text x="220" y="48" text-anchor="middle" class="h">张量并行 TP</text><text x="220" y="82" text-anchor="middle" class="b">每层矩阵按行或列切分</text>
    <g fill="#2563a9"><rect x="55" y="125" width="135" height="85" rx="14"/><rect x="250" y="125" width="135" height="85" rx="14"/></g><text x="122" y="177" text-anchor="middle" class="w">局部矩阵 0</text><text x="317" y="177" text-anchor="middle" class="w">局部矩阵 1</text>
    <path d="M122 225V300H317V225M220 300V360" fill="none" stroke="#2563a9" stroke-width="5" marker-end="url(#blue)"/><rect x="105" y="370" width="230" height="80" rx="14" fill="#dceafa" stroke="#2563a9" stroke-width="3"/><text x="220" y="420" text-anchor="middle" class="n">AllReduce 合并</text><text x="220" y="500" text-anchor="middle" class="b">每层关键路径 · 低延迟</text><text x="220" y="532" text-anchor="middle" class="b">高带宽 · 强同步</text>
  </g>
  <g transform="translate(530 105)"><rect width="440" height="555" rx="22" fill="#eef8f3" stroke="#249c69" stroke-width="3"/><text x="220" y="48" text-anchor="middle" class="h">流水线并行 PP</text><text x="220" y="82" text-anchor="middle" class="b">不同层放到不同芯片</text>
    <g fill="#249c69"><rect x="35" y="165" width="105" height="85" rx="14"/><rect x="168" y="165" width="105" height="85" rx="14"/><rect x="300" y="165" width="105" height="85" rx="14"/></g><g text-anchor="middle" class="w"><text x="87" y="217">层 0…N</text><text x="220" y="217">层 N…M</text><text x="352" y="217">层 M…</text></g>
    <path d="M145 207H160M278 207H292" stroke="#2563a9" stroke-width="5" marker-end="url(#blue)"/><text x="220" y="320" text-anchor="middle" class="n">只传递层间激活</text><rect x="70" y="370" width="300" height="40" rx="10" fill="#dff3e9"/><rect x="70" y="430" width="95" height="40" rx="10" fill="#dff3e9"/><text x="220" y="500" text-anchor="middle" class="b">带宽较低 · decode 易产生气泡</text><text x="220" y="532" text-anchor="middle" class="b">微批越少，利用率越低</text>
  </g>
  <g transform="translate(1015 105)"><rect width="440" height="555" rx="22" fill="#fff6e5" stroke="#e67c37" stroke-width="3"/><text x="220" y="48" text-anchor="middle" class="h">专家并行 EP</text><text x="220" y="82" text-anchor="middle" class="b">token 动态路由到不同专家</text>
    <g fill="#e67c37"><rect x="45" y="130" width="110" height="70" rx="14"/><rect x="285" y="130" width="110" height="70" rx="14"/><rect x="45" y="300" width="110" height="70" rx="14"/><rect x="285" y="300" width="110" height="70" rx="14"/></g><g text-anchor="middle" class="w"><text x="100" y="173">专家 0</text><text x="340" y="173">专家 1</text><text x="100" y="343">专家 2</text><text x="340" y="343">专家 3</text></g>
    <path d="M165 165L275 165M155 200L285 300M285 200L155 300M165 335H275" stroke="#e67c37" stroke-width="4" marker-end="url(#orange)"/><text x="220" y="440" text-anchor="middle" class="n">All-to-All 动态突发</text><text x="220" y="500" text-anchor="middle" class="b">路由运行时确定 · 易拥塞</text><text x="220" y="532" text-anchor="middle" class="b">需要负载均衡与流量控制</text>
  </g>
</svg>
