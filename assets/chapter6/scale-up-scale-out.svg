<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a9"/></marker><style>.title{font:700 34px sans-serif;fill:#17385f}.h{font:700 25px sans-serif;fill:#17385f}.b{font:18px sans-serif;fill:#506a80}.w{font:700 19px sans-serif;fill:#fff}.n{font:700 19px sans-serif;fill:#17385f}</style></defs>
  <rect width="1500" height="760" rx="24" fill="#fbfdff"/><text x="750" y="55" text-anchor="middle" class="title">Scale-up 与 Scale-out：两级互连解决不同问题</text>
  <rect x="55" y="105" width="650" height="520" rx="24" fill="#eef5fc" stroke="#2563a9" stroke-width="3"/><text x="380" y="150" text-anchor="middle" class="h">Scale-up 域：单机 / 单柜</text><text x="380" y="182" text-anchor="middle" class="b">8～72+ 芯片 · 极低延迟 · 集合通信卸载</text>
  <circle cx="380" cy="350" r="82" fill="#dceafa" stroke="#2563a9" stroke-width="4"/><text x="380" y="344" text-anchor="middle" class="n">Switch /</text><text x="380" y="373" text-anchor="middle" class="n">Torus</text>
  <g fill="#2563a9"><rect x="105" y="245" width="135" height="72" rx="13"/><rect x="105" y="430" width="135" height="72" rx="13"/><rect x="520" y="245" width="135" height="72" rx="13"/><rect x="520" y="430" width="135" height="72" rx="13"/></g><g class="w" text-anchor="middle"><text x="172" y="289">加速芯片 0</text><text x="172" y="474">加速芯片 1</text><text x="587" y="289">加速芯片 N</text><text x="587" y="474">加速芯片 N+1</text></g>
  <g stroke="#2563a9" stroke-width="5"><path d="M240 280L300 320"/><path d="M240 465L300 400"/><path d="M520 280L460 320"/><path d="M520 465L460 400"/></g><text x="380" y="570" text-anchor="middle" class="b">NVLink / UALink / 私有 SerDes</text>
  <path d="M720 365H805" stroke="#2563a9" stroke-width="6" marker-end="url(#a)"/><text x="762" y="340" text-anchor="middle" class="b">NIC</text>
  <rect x="820" y="105" width="625" height="520" rx="24" fill="#eef8f3" stroke="#249c69" stroke-width="3"/><text x="1132" y="150" text-anchor="middle" class="h">Scale-out 域：跨机柜 / 集群</text><text x="1132" y="182" text-anchor="middle" class="b">大规模扩展 · RoCE / InfiniBand / Ultra Ethernet</text>
  <g fill="#249c69"><rect x="875" y="240" width="190" height="95" rx="15"/><rect x="1200" y="240" width="190" height="95" rx="15"/><rect x="875" y="440" width="190" height="95" rx="15"/><rect x="1200" y="440" width="190" height="95" rx="15"/></g><g class="w" text-anchor="middle"><text x="970" y="295">Prefill 柜 0</text><text x="1295" y="295">Prefill 柜 N</text><text x="970" y="495">Decode 柜 0</text><text x="1295" y="495">Decode 柜 N</text></g>
  <rect x="1080" y="330" width="105" height="110" rx="16" fill="#dff3e9" stroke="#249c69" stroke-width="3"/><text x="1132" y="375" text-anchor="middle" class="n">网络</text><text x="1132" y="403" text-anchor="middle" class="n">交换机</text><g stroke="#249c69" stroke-width="5"><path d="M1065 285L1080 350"/><path d="M1200 285L1185 350"/><path d="M1065 485L1080 420"/><path d="M1200 485L1185 420"/></g><text x="1132" y="575" text-anchor="middle" class="b">PD 分离时还要承载 GB 级 KV Cache 迁移</text>
  <rect x="245" y="665" width="1010" height="58" rx="14" fill="#eaf3fb"/><text x="750" y="702" text-anchor="middle" class="n">片内 NoC 和 SRAM 也必须为互连流量预留带宽与缓冲</text>
</svg>
