<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a9"/></marker>
    <style>.title{font:700 29px sans-serif;fill:#17385f}.head{font:700 24px sans-serif;fill:#17385f}.box{font:600 19px sans-serif;fill:#27445f}.note{font:18px sans-serif;fill:#526b82}.strong{font:700 19px sans-serif;fill:#8c4b22}</style>
  </defs>
  <rect width="1400" height="660" rx="20" fill="#fbfdff"/>
  <text x="700" y="45" text-anchor="middle" class="title">稠密 FFN 与 MoE：规整计算和动态路由</text>
  <line x1="700" y1="82" x2="700" y2="610" stroke="#d8e3ed" stroke-width="2"/>

  <text x="350" y="100" text-anchor="middle" class="head">稠密 SwiGLU FFN</text>
  <g stroke="#2563a9" stroke-width="4" marker-end="url(#arrow)">
    <line x1="350" y1="165" x2="350" y2="205"/><line x1="350" y1="285" x2="350" y2="330"/>
    <line x1="350" y1="410" x2="350" y2="455"/><line x1="350" y1="535" x2="350" y2="575"/>
  </g>
  <rect x="245" y="120" width="210" height="45" rx="12" fill="#fff" stroke="#718096" stroke-width="3"/>
  <text x="350" y="149" text-anchor="middle" class="box">输入 x：[d]</text>
  <rect x="145" y="210" width="190" height="75" rx="12" fill="#dceafa" stroke="#2563a9" stroke-width="3"/>
  <rect x="365" y="210" width="190" height="75" rx="12" fill="#dceafa" stroke="#2563a9" stroke-width="3"/>
  <text x="240" y="242" text-anchor="middle" class="box">Gate 投影</text><text x="240" y="268" text-anchor="middle" class="note">xW_gate</text>
  <text x="460" y="242" text-anchor="middle" class="box">Up 投影</text><text x="460" y="268" text-anchor="middle" class="note">xW_up</text>
  <line x1="350" y1="165" x2="240" y2="205" stroke="#2563a9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="350" y1="165" x2="460" y2="205" stroke="#2563a9" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="245" y="335" width="210" height="75" rx="12" fill="#fff4d8" stroke="#c99319" stroke-width="3"/>
  <text x="350" y="366" text-anchor="middle" class="box">SiLU(Gate) ⊙ Up</text><text x="350" y="392" text-anchor="middle" class="note">逐元素激活与相乘</text>
  <line x1="240" y1="285" x2="315" y2="330" stroke="#2563a9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="460" y1="285" x2="385" y2="330" stroke="#2563a9" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="245" y="460" width="210" height="75" rx="12" fill="#dff3e9" stroke="#249c69" stroke-width="3"/>
  <text x="350" y="492" text-anchor="middle" class="box">Down 投影</text><text x="350" y="518" text-anchor="middle" class="note">[d_ff] → [d]</text>
  <rect x="245" y="580" width="210" height="45" rx="12" fill="#fff" stroke="#718096" stroke-width="3"/>
  <text x="350" y="609" text-anchor="middle" class="box">输出：[d]</text>
  <text x="350" y="646" text-anchor="middle" class="strong">每个 Token 使用同一组权重，计算规则</text>

  <text x="1050" y="100" text-anchor="middle" class="head">MoE：路由器选择少数专家</text>
  <rect x="945" y="120" width="210" height="45" rx="12" fill="#fff" stroke="#718096" stroke-width="3"/>
  <text x="1050" y="149" text-anchor="middle" class="box">Token 隐藏向量</text>
  <line x1="1050" y1="165" x2="1050" y2="205" stroke="#2563a9" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="945" y="210" width="210" height="70" rx="12" fill="#fff0e8" stroke="#e67c37" stroke-width="3"/>
  <text x="1050" y="240" text-anchor="middle" class="box">Router</text><text x="1050" y="264" text-anchor="middle" class="note">运行时计算 Top-k</text>
  <g fill="#eaf3fb" stroke="#7b9dbd" stroke-width="3">
    <rect x="755" y="355" width="125" height="80" rx="12"/><rect x="895" y="355" width="125" height="80" rx="12"/>
    <rect x="1035" y="355" width="125" height="80" rx="12"/><rect x="1175" y="355" width="125" height="80" rx="12"/>
  </g>
  <rect x="895" y="355" width="125" height="80" rx="12" fill="#dff3e9" stroke="#249c69" stroke-width="4"/>
  <rect x="1175" y="355" width="125" height="80" rx="12" fill="#dff3e9" stroke="#249c69" stroke-width="4"/>
  <g text-anchor="middle" class="box"><text x="817" y="402">专家 1</text><text x="957" y="402">专家 2 ✓</text><text x="1097" y="402">专家 3</text><text x="1237" y="402">专家 4 ✓</text></g>
  <g stroke="#8297aa" stroke-width="3" stroke-dasharray="7 5"><line x1="1050" y1="280" x2="817" y2="350"/><line x1="1050" y1="280" x2="1097" y2="350"/></g>
  <g stroke="#249c69" stroke-width="4" marker-end="url(#arrow)"><line x1="1050" y1="280" x2="957" y2="350"/><line x1="1050" y1="280" x2="1237" y2="350"/></g>
  <line x1="957" y1="435" x2="1020" y2="495" stroke="#249c69" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1237" y1="435" x2="1080" y2="495" stroke="#249c69" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="945" y="500" width="210" height="70" rx="12" fill="#fff4d8" stroke="#c99319" stroke-width="3"/>
  <text x="1050" y="530" text-anchor="middle" class="box">加权合并专家输出</text><text x="1050" y="555" text-anchor="middle" class="note">仅激活 Top-k 专家</text>
  <text x="1050" y="610" text-anchor="middle" class="strong">总参数量大，单 Token 计算量较小</text>
  <text x="1050" y="646" text-anchor="middle" class="note">代价：动态搬运、负载不均与跨芯片通信</text>
</svg>
