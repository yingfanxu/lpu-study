<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a9"/></marker>
    <style>.title{font:700 29px sans-serif;fill:#17385f}.box{font:600 20px sans-serif;fill:#27445f}.small{font:17px sans-serif;fill:#536b80}.side{font:700 18px sans-serif;fill:#8c4b22}</style>
  </defs>
  <rect width="1200" height="1200" rx="20" fill="#fbfdff"/>
  <text x="600" y="45" text-anchor="middle" class="title">单层 Transformer 的完整数据流</text>
  <g stroke="#2563a9" stroke-width="4" marker-end="url(#a)">
    <line x1="570" y1="120" x2="570" y2="155"/><line x1="570" y1="215" x2="570" y2="250"/>
    <line x1="570" y1="330" x2="570" y2="365"/><line x1="570" y1="425" x2="570" y2="460"/>
    <line x1="570" y1="540" x2="570" y2="575"/><line x1="570" y1="635" x2="570" y2="690"/>
    <line x1="570" y1="750" x2="570" y2="785"/><line x1="570" y1="845" x2="570" y2="880"/>
    <line x1="570" y1="960" x2="570" y2="1015"/><line x1="570" y1="1075" x2="570" y2="1110"/>
  </g>
  <rect x="410" y="70" width="320" height="50" rx="12" fill="#fff" stroke="#718096" stroke-width="3"/>
  <text x="570" y="102" text-anchor="middle" class="box">输入 X：[n × d]</text>
  <rect x="410" y="160" width="320" height="55" rx="12" fill="#efeafb" stroke="#7753a6" stroke-width="3"/>
  <text x="570" y="195" text-anchor="middle" class="box">① RMSNorm</text>
  <rect x="330" y="255" width="480" height="75" rx="12" fill="#dceafa" stroke="#2563a9" stroke-width="3"/>
  <text x="570" y="286" text-anchor="middle" class="box">② Q / K / V 线性投影</text><text x="570" y="313" text-anchor="middle" class="small">三次矩阵乘；读取 W_Q、W_K、W_V</text>
  <rect x="410" y="370" width="320" height="55" rx="12" fill="#efeafb" stroke="#7753a6" stroke-width="3"/>
  <text x="570" y="405" text-anchor="middle" class="box">③ 对 Q、K 应用 RoPE</text>
  <rect x="410" y="465" width="320" height="75" rx="12" fill="#e4f4ea" stroke="#249c69" stroke-width="3"/>
  <text x="570" y="496" text-anchor="middle" class="box">④ 写入当前 K、V</text><text x="570" y="523" text-anchor="middle" class="small">追加到 KV Cache</text>
  <rect x="310" y="580" width="520" height="55" rx="12" fill="#fff4d8" stroke="#c99319" stroke-width="3"/>
  <text x="570" y="615" text-anchor="middle" class="box">⑤ QKᵀ → Softmax → 加权求和 V</text>
  <rect x="360" y="695" width="420" height="55" rx="12" fill="#dceafa" stroke="#2563a9" stroke-width="3"/>
  <text x="570" y="730" text-anchor="middle" class="box">⑥ 输出投影 W_O</text>
  <circle cx="570" cy="815" r="30" fill="#fff0e8" stroke="#e67c37" stroke-width="3"/>
  <text x="570" y="823" text-anchor="middle" class="box">⑦ +</text>
  <path d="M405 95H180V815H535" fill="none" stroke="#e67c37" stroke-width="4" marker-end="url(#a)"/>
  <text x="190" y="450" class="side" transform="rotate(-90 190 450)">第一次残差旁路：保留输入 X</text>
  <rect x="410" y="885" width="320" height="75" rx="12" fill="#efeafb" stroke="#7753a6" stroke-width="3"/>
  <text x="570" y="916" text-anchor="middle" class="box">⑧ RMSNorm</text><text x="570" y="943" text-anchor="middle" class="small">FFN 入口</text>
  <rect x="270" y="1020" width="600" height="55" rx="12" fill="#dceafa" stroke="#2563a9" stroke-width="3"/>
  <text x="570" y="1055" text-anchor="middle" class="box">⑨ Gate / Up → SiLU 与逐元素乘 → Down</text>
  <circle cx="570" cy="1140" r="30" fill="#fff0e8" stroke="#e67c37" stroke-width="3"/>
  <text x="570" y="1148" text-anchor="middle" class="box">⑩ +</text>
  <path d="M535 815H930V1140H605" fill="none" stroke="#e67c37" stroke-width="4" marker-end="url(#a)"/>
  <text x="920" y="980" class="side" transform="rotate(90 920 980)">第二次残差旁路：保留 FFN 输入</text>

  <g transform="translate(900 180)">
    <text x="0" y="0" class="box">硬件资源图例</text>
    <rect x="0" y="25" width="28" height="28" rx="5" fill="#dceafa" stroke="#2563a9" stroke-width="2"/><text x="42" y="46" class="small">矩阵引擎</text>
    <rect x="0" y="65" width="28" height="28" rx="5" fill="#fff4d8" stroke="#c99319" stroke-width="2"/><text x="42" y="86" class="small">注意力引擎</text>
    <rect x="0" y="105" width="28" height="28" rx="5" fill="#efeafb" stroke="#7753a6" stroke-width="2"/><text x="42" y="126" class="small">向量引擎</text>
    <rect x="0" y="145" width="28" height="28" rx="5" fill="#e4f4ea" stroke="#249c69" stroke-width="2"/><text x="42" y="166" class="small">存储系统</text>
  </g>
  <rect x="900" y="400" width="230" height="155" rx="12" fill="#f5f8fb" stroke="#b7c7d6" stroke-width="2"/>
  <text x="1015" y="433" text-anchor="middle" class="box">KV Cache</text>
  <text x="1015" y="468" text-anchor="middle" class="small">写：当前 K、V</text><text x="1015" y="500" text-anchor="middle" class="small">读：全部历史 K、V</text>
  <path d="M830 607H1015V555" fill="none" stroke="#249c69" stroke-width="3" marker-end="url(#a)"/>
  <text x="750" y="1185" text-anchor="middle" class="box">输出：[n × d] → 下一层</text>
  <line x1="600" y1="1140" x2="700" y2="1170" stroke="#2563a9" stroke-width="4" marker-end="url(#a)"/>
</svg>
